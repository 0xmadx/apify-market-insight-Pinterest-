# Deploy to Apify — BREAK-GLASS ONLY. `./ship.sh apify` is the real path.
#
# WHY THE TAG TRIGGER WAS REMOVED, 2026-09-10. This used to fire on
# `push: tags: ["v*"]`. `.actor/actor.json` carries `buildTag: latest`, so that
# made `git tag v1 && git push --tags` an immediate, unannounced release to
# every existing customer — reached minutes later, from a workflow that does
# NOT check the vault, does NOT run the 16 live probes, does NOT smoke the
# deployed actor (it says so itself, below), and never asks the one question
# that matters: could a customer's existing code break if this landed tonight?
#
# A tag is also a label people add casually and can point at any commit. The
# blast radius of a typo should not be "all customers, now".
#
# `./ship.sh apify` is the single path to customers: vault check, 16 live
# probes, all 12 suites, a clean-tree refusal, and a human confirming the
# compatibility answer at a real terminal. This file stays only as
# `workflow_dispatch` — a deliberate button someone presses, having read the
# above — for the case where the operator's machine is unavailable.
name: deploy

on:
  workflow_dispatch:

jobs:
  push-to-apify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The gate runs again here rather than trusting that it ran on the commit
      # being tagged: a tag can point anywhere, including at a commit that never
      # saw CI.
      - name: Re-run the offline gate
        env:
          TEST_REDIS_URL: redis://localhost:6380/0
        run: |
          docker run -d -p 6380:6379 redis:alpine
          sleep 3
          fail=0
          for t in test_incremental test_shopping_api test_shopping_traversal \
                   test_full_project test_dispatch test_adspower test_vault \
                   test_quick_start test_main_messages test_status_healthcheck \
                   test_ignore_parity test_ci_contract; do
            python -m tests.$t || fail=1
          done
          exit $fail

      - name: Install Apify CLI
        run: npm install -g apify-cli

      - name: Push
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: apify push --wait-for-finish=420

      # Deliberately NOT smoking here. smoke.sh calls the deployed actor, which
      # needs the vault -- and that means putting the Upstash password into
      # GitHub too. Smoke from a machine that already has it:
      #     ./smoke.sh radar
