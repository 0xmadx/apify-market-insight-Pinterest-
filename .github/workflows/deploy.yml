# Deploy to Apify — on a TAG, never on a push to main.
#
# WHY A TAG. `.actor/actor.json` carries `buildTag: latest`, so a push reaches
# existing customers on their next run, minutes later, with no notice. Wiring
# that to every commit on main would mean any typo fix is an unannounced
# production release. A tag makes the release a decision someone made, and the
# tag itself is the rollback point.
#
# ROLLBACK: tag the previous good commit and push that tag.
name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # so a human can also release deliberately

jobs:
  push-to-apify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The gate runs again here rather than trusting that it ran on the commit
      # being tagged: a tag can point anywhere, including at a commit that never
      # saw CI.
      - name: Re-run the offline gate
        env:
          TEST_REDIS_URL: redis://localhost:6380/0
        run: |
          docker run -d -p 6380:6379 redis:alpine
          sleep 3
          fail=0
          for t in test_incremental test_shopping_api test_shopping_traversal \
                   test_full_project test_dispatch test_adspower test_vault \
                   test_quick_start test_main_messages; do
            python -m tests.$t || fail=1
          done
          exit $fail

      - name: Install Apify CLI
        run: npm install -g apify-cli

      - name: Push
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: apify push --wait-for-finish=420

      # Deliberately NOT smoking here. smoke.sh calls the deployed actor, which
      # needs the vault -- and that means putting the Upstash password into
      # GitHub too. Smoke from a machine that already has it:
      #     ./smoke.sh radar
